##########################################################
# Config to generate all possible ENDomes from Ebbert and Wood data

pipeline_runs:
  - dataset: "Wood"
    group: ["control", "all"]
    merge_preset: ["st_ref", "iso_ref", "iso"]
  - dataset: "Ebbert"
    group: ["control", "all"]
    merge_preset: ["st_ref", "iso_ref", "iso"]
  - dataset: "Shimada"
    group: "all"
    merge_preset: ["pb_ref"]
  - dataset: "ENCODE_RushAD"
    group: "all"
    merge_preset: ["pb_ref"]