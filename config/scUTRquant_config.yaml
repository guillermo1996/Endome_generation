# scUTRquant config template (step 06).

## Filled in by the pipeline (values here are ignored)
target: null          # the ENDome
targets_config: null  # the ENDome's targets YAML (06-UTR_Quantification/Targets/)
sample_file: null     # sc_dataset.sample_sheet in config/config.yaml

## Dataset-specific: check these for every new single-cell dataset
dataset_name: "hardy_snRNAseq" # name of the output SCE: data/sce/<ENDome>/<dataset_name>.txs.Rds
tech: "10xv3"                  # kallisto bus technology string (read structure of the chemistry)
strand: "--fr-stranded"        # read orientation
bx_whitelist: "data/bxs/3M-february-2018.txt" # 10x barcode whitelist of the chemistry

## Cell filtering
min_umis: 50 
cell_annots: null
cell_annots_key: "cell_id"
exclude_unannotated_cells: False
sample_regex: ".*"
correct_bus: True

## Outputs
output_type:
  - "txs"   # bin (transcript) counts
output_format:
  - "sce"
use_hdf5: False
include_reports: True
tmp_dir: "~/tmp"
