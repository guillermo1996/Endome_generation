############################################################
#              PIPELINE STEP CONFIGURATIONS
#
# Steps follow the order of execution: 01 Alignment → 02 Assembly → 
# 03 Artifact Removal → 04 ORF Identification → 05 Truncation → 06 Evaluation
############################################################

############################
# 00. TESTING / DEV MODE
############################
# Set use_toy_data: True to run a fast subsampled test of the pipeline.
# subsample_prop uses a string code: "001" = 0.1%, "010" = 1%, etc.
use_toy_data: False
subsample_seed:  1
subsample_prop:  "001"        # 0.1% of reads



############################
# 01. ALIGNMENT
############################
minimap2_profile: default     # Options: default | k15

minimap2_settings:
  default:
    minimap2_kmer:  14
    minimap2_flags: "-ax splice -uf --MD --secondary=no"
  k15:
    minimap2_kmer:  15
    minimap2_flags: "-ax splice -uf --MD --secondary=no"


############################
# 02. TRANSCRIPTOME ASSEMBLY
############################
# Profile naming convention: <assembly_mode>_<merge_mode>
#   "unguided" = run without reference GTF
#   "guided"   = run with reference GTF (-G flag)

stringtie_profile:  unguided_guided # unguided_guided | unguided_unguided | guided_guided | guided_unguided
gffcompare_profile: default

stringtie_settings:
  unguided_guided:
    assembly_guided: False
    assembly_flags:  "-L --rf"
    merge_guided:    True 
    merge_flags:     "-L"
  unguided_unguided:
    assembly_guided: False
    assembly_flags:  "-L --rf"
    merge_guided:    False
    merge_flags:     "-L"
  guided_guided:
    assembly_guided: True
    assembly_flags:  "-L --rf"
    merge_guided:    True
    merge_flags:     "-L"
  guided_unguided:
    assembly_guided: True
    assembly_flags:  "-L --rf"
    merge_guided:    False
    merge_flags:     "-L"

gffcompare_settings:
  default:
    gffcompare_flags: "-T"
  strict:                              # Tighter exon/intron boundary tolerances
    gffcompare_flags: "--strict-match -e 50 -d 50 -T"

############################
# 03. ARTIFACT REMOVAL
############################
pigeon_profile: default  

pigeon_settings:
  default: {} 

############################
# 04. ORF IDENTIFICATION
############################
orfannotate_profile: default 
orf_filter_profile:  pc

orfannotate_settings:
  default:
    version: "v1.1.0"
    gffread_clean: False

### ORF filter profiles control which gene/transcript/ORF types are retained
orf_filter_settings:
  all: # No filtering — keep all ORF classes and biotypes
    valid_ref_gene_type:       ["all"]
    valid_ref_tx_type:         ["all"]
    valid_orfannotate_type:    ["all"]
    in_ref_filter:             ""
  orfann_coding: # Keep only ORFannotate-classified coding transcripts
    valid_ref_gene_type:       ["all"]
    valid_ref_tx_type:         ["all"]
    valid_orfannotate_type:    ["coding"]
    in_ref_filter:             ""
  pc: # Strict: protein-coding biotype + coding ORF + in-reference
    valid_ref_gene_type:       ["protein_coding"]
    valid_ref_tx_type:         ["protein_coding"]
    valid_orfannotate_type:    ["coding"]
    in_ref_filter:             "True"

############################
# 05. TRUNCATION
############################
gtxcutr_profile: default

gtxcutr_settings:
  default:
    merge_distance: 200 # Max distance (bp) between truncation sites to merge
    genome: "hg38"

############################
# 06. EVALUATION
############################
# Sample sheet used for evaluation (snRNA-seq cell × barcode metadata)
evaluation_sample_file: "data/Hardy_snRNAseq/sample_sheet_ACG_toy.csv"

kb_profile: default          # Options: default

kb_settings:
  default:
    tech:   "10xv3"
    strand: "--fr-stranded"

############################
# 06. EVALUATION
############################
# Sample sheet used for evaluation (snRNA-seq cell × barcode metadata)
evaluation_sample_file: "data/Hardy_snRNAseq/sample_sheet_ACG_toy.csv"

kb_profile: default

kb_settings:
  default:
    tech:   "10xv3"
    strand: "--fr-stranded"




