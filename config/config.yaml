############################
# 05. TRUNCATION
############################
txendcutr_preset: default
mmseqs2_preset: default

txendcutr_settings:
  default:
    merge_distance: 200 # Max distance (bp) between truncation sites to merge
    genome: "hg38"

mmseqs2_settings:
  default:
    sensitivity: 7.5
    evalue: 10000
    max_seqs: 5000
    max_accept: 100000
    max_rejected: 100000
    alignment_mode: 3
    coverage: 0
    cov_mode: 0
    restrict_to_gene: TRUE # Drop cross-gene hits before storing

scoring_settings:
  default:
    protein_metric: "bsr_max" # bsr_max | bsr_min | bsr_mixed | fident
    length_scaling: "ratio" # ratio | canberra
    member_weights: "uniform"
    compute_sim_pid: FALSE # redundant with bsr calculation
    component_weights:
      protein: 1.0
      cds_len: 0.1
      start_codon: 0.2
      stop_codon: 0.2
      nmd: 0.4

############################
# 06. UTR QUANTIFICATION
############################
scUTRquant_config_template: "config/scUTRquant_config.yaml"

scUTRquant_preset: default
scUTRquant_settings:
  default:
    version: "v0.5.1"
    genome: "hg38"
    
############################
# 07. UTR USAGE
############################
pseudobulk_settings:
  default: # Txs threhsold fixed effes per cell type
    effective_txs_mode: "fixed"
    min_effective_txs: 300
    cell_type_level: "annotation_level_2"
  dynamic: # Txs threhsold per cell type based on Median Absolute Deviation (MAD)
    effective_txs_mode: "mad"
    mad_below_median: 3 # how many standard deviations below mad to remove
    cell_type_level: "annotation_level_2"

satuRn_settings:
  default:
    annotations: "data/Hardy_snRNAseq/annotations/annotation_all_levels_all_nuclei_updated.csv"
    sample_metadata: "data/Hardy_snRNAseq/annotations/SAMPLE.csv"
    sample_covariates: "data/Hardy_snRNAseq/annotations/Hardy_final_covariates_weighted_and_combined_batches.csv"
    exclude_samples: ["gosot"]
    regions: ["ACG", "IPL"]
    celltypes: null
    contrasts: ["PDD-Control", "PD-Control", "PDD-PD"]
    covariates: ["sex", "rin_bxp", "deletion_length", "insertion_length", "uniquely_mapped_percent"]
    min_cells: 5
    min_genes: 10
    min_samples_per_group: 3
    dmfilter:
      min_samps_gene_prop: 0.75
      min_gene_expr: 10
      min_feature_expr: 10
    p_value: "empirical" # raw | empirical | none (skip stageR)
    alpha: 0.05
  raw:
    annotations: "data/Hardy_snRNAseq/annotations/annotation_all_levels_all_nuclei_updated.csv"
    sample_metadata: "data/Hardy_snRNAseq/annotations/SAMPLE.csv"
    sample_covariates: "data/Hardy_snRNAseq/annotations/Hardy_final_covariates_weighted_and_combined_batches.csv"
    exclude_samples: ["gosot"]
    regions: ["ACG", "IPL"]
    celltypes: null
    contrasts: ["PDD-Control", "PD-Control", "PDD-PD"]
    covariates: ["sex", "rin_bxp", "deletion_length", "insertion_length", "uniquely_mapped_percent"]
    min_cells: 5
    min_genes: 10
    min_samples_per_group: 3
    dmfilter:
      min_samps_gene_prop: 0.75
      min_gene_expr: 10
      min_feature_expr: 10
    p_value: "raw" # raw | empirical | none (skip stageR)
    alpha: 0.05