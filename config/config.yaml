##########################################################
# Main config file for the ENDome generation pipeline

##########################################################
# PART A - RUN CONFIGURATION

############################
# 01. WHAT TO RUN
############################

## ENDome generation steps
input_dataset: ["Wood"] # Long-read dataset: Wood | Ebbert
input_group: ["control"] # Sample group within the dataset: control | case | control_case
trunc_site: ["3p", "5p"] # Truncation site: 3p | 5p
trunc_width: [500, 300] # Window size (bp) around truncation site

merge_preset: ["st_ref"] # Transcript merging: st_* = StringTie, iso_* = isomatch
orf_filter_preset: ["ref_pc", "pc_novel"] # Transcripts kept after ORF identifications

## UTR Usage steps
pseudobulk_preset: ["default", "dynamic"]
satuRn_preset: ["default", "raw"]

############################
# 03. PATHS
############################

## Reference genome and annotation (GENCODE GRCh38 / v48)
ref_genome: "/home/MinaRyten/Guillermo/Resources/Genome/GRCh38.primary_assembly.genome.fa"
ref_annotation: "/home/MinaRyten/Guillermo/Resources/GENCODE/gencode.v48.annotation.gtf"

## Output directories
main_output_path: "debug_results"
log_path: ".logs"
benchmark_path: ".benchmarks"

############################
# 04. INPUT DATASETS
############################

## Long-read samples used to generate the ENDome (steps 01-05)
### Tab-separated file with one row per sample and the columns:
###   dataset    dataset name, as used in "input_dataset"
###   group      sample group within the dataset: control | case
###   sample_id  unique sample name within the dataset
###   file_type  fastq = raw reads, the sample starts at 01 Alignment
###              bam   = aligned and coordinate-sorted reads, the sample skips to 02 Assembly
###   path       path to the FASTQ (.fastq / .fastq.gz) or BAM file
input_endome_samples: "data/endome_input_samples.tsv"


## Single-nucleus dataset on which the ENDome is quantified (step 06) and
## tested for differential UTR usage (step 07). File formats and how to prepare
## them for a new dataset: docs/UTR_quantification_and_usage.md
sc_dataset:
  # Step 06: scUTRquant sample sheet and config template
  sample_sheet: "data/Hardy_snRNAseq/sample_sheet.csv"
  scUTRquant_config_template: "config/scUTRquant_config.yaml"

  # Step 07: cell annotation and sample tables (TSV, built by T07a for Hardy)
  cell_annotations: "data/Hardy_snRNAseq/prepared/Hardy.cell_annotations.tsv.gz"
  sample_table: "data/Hardy_snRNAseq/prepared/Hardy.sample_table.tsv"
  exclude_samples: ["gosot_ACG", "gosot_IPL"] # sample_id values to remove

  # Step 07: what to compare
  stratify_by: "region" # sample_table column: one model per value (null = no strata)
  celltypes: null # null = every cell type available
  contrasts: ["PDD-Control", "PD-Control", "PDD-PD"] # "<group1>-<group2>", values of the "group" column
  covariates: ["sex", "rin_bxp", "deletion_length", "insertion_length", "uniquely_mapped_percent"]

############################
# 02. TOOL PRESETS
############################

## 01 - Alignment
minimap2_preset: default

## 02 - Transcriptome Assembly
stringtie_assembly_preset: unguided
gffcompare_preset: default

## 03 - Artifact Removal
pigeon_preset: default

## 04 - ORF Identification
orfannotate_preset: default

## 05 - Truncation
txendcutr_preset: default
mmseqs2_preset: default
scoring_preset: default

## 06 - UTR Quantification
scUTRquant_preset: default

############################
# 05. RUN BEHAVIOUR
############################

## Output folder hashing
use_hash: True

## Testing / dev mode
debug: False

use_toy_data: False
subsample_seed: 1
subsample_prop: "0001" # 0.1% of reads