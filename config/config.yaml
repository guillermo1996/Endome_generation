############################################################
#              PIPELINE STEP CONFIGURATIONS
#
# Steps follow the order of execution: 
# 01 Alignment → 02 Assembly → 03 Artifact Removal → 04 ORF Identification → 05 Truncation → 06 Evaluation
############################################################

############################
# 00. TESTING / DEV MODE
############################
# Set debug: True to print load-time / per-step timing instrumentation to
# stderr. Leave False for normal (quiet) runs.
debug: False

# Set use_toy_data: True to run a fast subsampled test of the pipeline.
# subsample_prop uses a string code: "001" = 0.1%, "010" = 1%, etc.
use_toy_data: False
subsample_seed: 1
subsample_prop: "0001"        # 0.1% of reads


############################
# 01. ALIGNMENT
############################
minimap2_preset: default     # Options: default | k15

minimap2_settings:
  default:
    minimap2_kmer:  14
    minimap2_flags: "-ax splice -uf --MD --secondary=no"
  k15:
    minimap2_kmer:  15
    minimap2_flags: "-ax splice -uf --MD --secondary=no"


############################
# 02. TRANSCRIPTOME ASSEMBLY
############################
stringtie_assembly_preset: unguided
gffcompare_preset: default

isomatch_version: "v0.6.0"

stringtie_assembly_settings:
  unguided:
    assembly_guided: False
    assembly_flags: "-L --rf"
  guided:
    assembly_guided: True
    assembly_flags: "-L --rf"

merge_settings:
  st_ref:
    use_reference: True
    merge_flags: "-L"
  st:
    use_reference: False
    merge_flags: "-L"
  iso_ref:
    use_reference: True
    merge_flags: ""
    min_fpkm: 1.0
    min_tpm: 1.0
    min_sample_cnt: 0
  iso_ref_lean:
    use_reference: True
    merge_flags: ""
    min_fpkm: 0.0
    min_tpm: 0.0
    min_sample_cnt: 0
  iso:
    use_reference: False
    merge_flags: ""
    min_fpkm: 1.0
    min_tpm: 1.0
  iso_ref_long:
    use_reference: True
    merge_flags: "--tss-policy longer --tes-policy longer"
    min_fpkm: 1.0
    min_tpm: 1.0
  iso_ref_bed:
    use_reference: True
    merge_flags: ""
    min_fpkm: 1.0
    min_tpm: 1.0
    use_bed_files: True

gffcompare_settings:
  default:
    gffcompare_flags: "-T"
  strict: # Tighter exon/intron boundary tolerances
    gffcompare_flags: "--strict-match -e 50 -d 50 -T"


