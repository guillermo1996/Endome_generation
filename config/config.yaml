############################
# 03. ARTIFACT REMOVAL
############################
pigeon_preset: default

pigeon_settings:
  default: {} 

############################
# 04. ORF IDENTIFICATION
############################
orfannotate_preset: default

orfannotate_settings:
  default:
    version: "v1.0.0"
    gffread_clean: False

### ORF filter settings control which gene/transcript/ORF types are retained

### ORF filter presets: which transcripts 04b keeps. Every list key takes ["all"]
### to disable it. ref_isoform and structural_category come from pigeon (via 04a).
###   valid_ref_gene_type        biotype of the reference gene (NA without a reference gene)
###   valid_ref_tx_type          biotype of the reference transcript (FSM only, NA otherwise)
###   valid_orfannotate_type     ORFannotate coding class ("coding" / "noncoding")
###   valid_structural_category  pigeon structural category
###   ref_isoform_filter         "TRUE"/"FALSE" keeps only (non-)reference isoforms
###                              (pigeon FSM, alternative ends included); "" = no filter
orf_filter_settings:
  ref_pc:                      # Reference protein-coding isoforms (alternative 5'/3' ends included) with a coding ORF
    valid_ref_gene_type:       ["protein_coding"]
    valid_ref_tx_type:         ["protein_coding"]
    valid_orfannotate_type:    ["coding"]
    valid_structural_category: ["all"]
    ref_isoform_filter:        "TRUE"
  pc_novel:                     # Every coding transcript except fragments (ISM): new genes and isoforms kept
    valid_ref_gene_type:       ["all"]
    valid_ref_tx_type:         ["all"]
    valid_orfannotate_type:    ["coding"]
    valid_structural_category: ["full-splice_match", "novel_in_catalog", "novel_not_in_catalog", "antisense", "genic", "genic_intron", "intergenic", "fusion"]
    ref_isoform_filter:        ""
  pc_all:                      # Every transcript with a coding ORF, any category
    valid_ref_gene_type:       ["all"]
    valid_ref_tx_type:         ["all"]
    valid_orfannotate_type:    ["coding"]
    valid_structural_category: ["all"]
    ref_isoform_filter:        ""
  all:                         # No filtering (debugging)
    valid_ref_gene_type:       ["all"]
    valid_ref_tx_type:         ["all"]
    valid_orfannotate_type:    ["all"]
    valid_structural_category: ["all"]
    ref_isoform_filter:        ""

