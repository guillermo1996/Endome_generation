  output_type:
    - "txs"
    - "genes"
  output_format:
    - "sce"
  tmp_dir: "/home/drihome/MRGuillermoPerez/tmp"
  bx_whitelist: null
  correct_bus: True
  min_umis: 500
  targets_config: "config/utrome_config.yaml"
  use_hdf5: False
  include_reports: True