### Path to reference annotation
ref_annotation: "/home/drihome/MRGuillermoPerez/RytenLab-Research/Resources/GENCODE/gencode.v48.annotation.gtf"

################################################################################
## Input samples
input_dir: "/home/MinaRyten/Emil/public_data/long-read/Ebbert_2023"
input_metadata: "/home/MinaRyten/Emil/public_data/long-read/Ebbert_2023/sample_metadata.tsv"
use_controls_as_input: True

input_samples:
  -sample_1092_PAM41667.fastq.gz
  -sample_1131_PAM44580.fastq.gz  
  -sample_1163_PAM44604.fastq.gz
  -sample_1271_PAM44815.fastq.gz
  -sample_1304_PAM44487.fastq.gz
  -sample_5356_PAM42933.fastq.gz

  -sample_1218_PAM43779.fastq.gz
  -sample_5292_PAG75292.fastq.gz
  -sample_579_PAG75663.fastq.gz
  -sample_1186_PAM43869.fastq.gz
  -sample_1291_PAG71816.fastq.gz
  -sample_5295_PAG77944.fastq.gz

sample_suffix: ".fastq.gz"
sample_prefix: ""

## Output directories
results_path: "results_k15"
log_path: "results_k15/outputs/logs"
benchmark_path: "results_k15/outputs/benchmarks"

################################################################################
## Minimap2 Configurations
minimap2_flags: "-ax splice -uf --MD --secondary=no"
k_flag: 15

################################################################################
## StringTie Configurations
ref_in_assembly: False
ref_in_merge: True

long_read_processing_in_assembly: True
long_read_processing_in_merge: False

################################################################################
## Sqanti3 Configurations

### Path to Sqanti3 directory if installed locally (Required: recommended default)
### If it does not exists, it will be created via the download script.
#sq3_path: "resources/Sqanti3_v5.3.6"

### Path to Sqanti3 download directory - (Required: recommended default)
sq3_download_script: "workflow/scripts/download_sqanti3.sh"

################################################################################
## ORF Filtration

### Whether to use AGAT, gffread or none to ensure correctness in the resulting GTF from Sqanti3
gtf_correction_method: "gffread" # Other valid options are 'gffread' or 'none/NULL'.
filter_gtf_preTruncation: False

### Control the transcript categories to keep
valid_ref_gene_type: ["protein_coding"]
valid_ref_tx_type: ["protein_coding"]
valid_sq3_type: ["known-ORF", "novel-ORF"]

hasCDS_filter: True
in_ref_filter: True

################################################################################
## ORF Evaluation
sample_file: "data/sample_sheet copy.csv"
tech: "10xv3" 
strand: "--fr-stranded" 