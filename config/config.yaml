############################################################
#                 SOFTWARE CONFIGURATIONS
############################################################

############################
# 00. Testing Pipeline
############################
use_toy_data: False
subsample_seed: 1
subsample_prop: "001" # 0.1%

assembly_test: "st_ungui_gui"

############################
# 01. ALIGNMENT
############################
minimap2_profile: default

### Minimap2 settings
minimap2_settings:
  default:
    minimap2_kmer: 14                                       # K-mer size for seeding alignments
    minimap2_flags: "-ax splice -uf --MD --secondary=no"    # Alignment mode and additional flags
  k15:
    minimap2_kmer: 15
    minimap2_flags: "-ax splice -uf --MD --secondary=no"

############################
# 02. TRANSCRIPTOME ASSEMBLY
############################
stringtie_profile: unguided_guided
gffcompare_profile: default

### StringTie2 settings
stringtie_settings:
  unguided_guided:
    assembly_guided: False                                  # Use un-guided assembly
    assembly_flags: "-L --rf"                               # Assembly parameters
    merge_guided: True                                      # Use guided merging with reference GTF
    merge_flags: "-L"                                       # Merge parameters
  unguided_unguided:
    assembly_guided: False
    assembly_flags: "-L --rf"
    merge_guided: False
    merge_flags: "-L"
  guided_guided:
    assembly_guided: True
    assembly_flags: "-L --rf"
    merge_guided: True
    merge_flags: "-L"
  guided_unguided:
    assembly_guided: True
    assembly_flags: "-L --rf"
    merge_guided: False
    merge_flags: "-L"

### gffcompare settings
gffcompare_settings:
  default:
    gffcompare_flags: "-T"
  strict:
    gffcompare_flags: "--strict-match -e 50 -d 50 -T"

  
############################
# 03. Artifact Removal
############################
pigeon_profile: default

### Pigeon settings
pigeon_settings:
  default: {}

############################
# 04. ORF Identification
############################
orfannotate_profile: default
orf_filter_profile: default

### ORFannotate settings
orfannotate_settings:
  default:
    version: "v1.0.0"
    gffread_clean: True

### ORF Filter settings
orf_filter_settings:
  default:
    valid_ref_gene_type: ["all"]
    valid_ref_tx_type: ["all"]
    valid_orfannotate_type: ["coding"]
    in_ref_filter: ""
    
############################
# 05. Truncation
############################
gtxcutr_profile: default

### gtxcutr settings
gtxcutr_settings:
  default:
    merge_distance: 200
    genome: "hg38"

############################
# 06. Evaluation
############################
evaluation_sample_file: "data/Hardy_snRNAseq/sample_sheet_ACG.csv"
kb_profile: default

### Kallisto bustools (kb) settings
kb_settings:
  default:
    tech: "10xv3"
    strand: "--fr-stranded"