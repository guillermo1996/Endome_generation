############################
# 05. TRUNCATION
############################
txendcutr_preset: default
mmseqs2_preset: default

txendcutr_settings:
  default:
    merge_distance: 200 # Max distance (bp) between truncation sites to merge
    genome: "hg38"

mmseqs2_settings:
  default:
    sensitivity: 7.5
    evalue: 10000
    max_seqs: 5000
    max_accept: 100000
    max_rejected: 100000
    alignment_mode: 3
    coverage: 0
    cov_mode: 0
    restrict_to_gene: TRUE # Drop cross-gene hits before storing

scoring_settings:
  default:
    protein_metric: "bsr_max" # bsr_max | bsr_min | bsr_mixed | fident
    length_scaling: "ratio" # ratio | canberra
    member_weights: "uniform"
    compute_sim_pid: FALSE # redundant with bsr calculation
    component_weights:
      protein: 1.0
      cds_len: 0.1
      start_codon: 0.2
      stop_codon: 0.2
      nmd: 0.4

