##########################################################
# Main config file for Endome generation pipeline
#
# PRESET PATTERN
# ---------------
# Each tool has an active "<tool>_preset" key that selects a named entry from
# the corresponding "<tool>_settings" block. To switch configurations, change
# only the preset key. Feel free to add custom presets that match your needs.
#
# (Note: these are pipeline-level parameter settings, distinct from Snakemake's
# own execution profiles in workflow/profiles/, which control runtime/resources.)
#
# Example: to switch ORF filtering, simply change "orf_filter_preset": pc → all
#
#
# COMBINATORIAL PARAMETERS 
# ----------------------------
# Four parameters accept lists and drive a combinatorial expansion:
#
#   input_dataset  — which dataset(s) to process [Wood/Ebbert/Gencode]
#   input_group    — which sample group(s) within each dataset [case/control/both]
#   trunc_site     — truncation site(s) to apply [3'/5']
#   trunc_width    — truncation window width(s) in bp [integer > 150]
#
# The pipeline runs once for every combination of these values.
#
# Example — 4 runs total:
#   input_dataset: ["Wood", "Ebbert"]
#   input_group:   ["control"]
#   trunc_site:    ["3p", "5p"]
#   trunc_width:   [500]
#
# All other parameters apply uniformly to every run.
##########################################################

# Folder/file structure:
#   {main_output_path}/
#   └── {input_dataset}.{input_group}/       # one folder per dataset × group combination
#       ├── 01-Alignment[-{hash}]/
#       ├── ...
#       └── 05-Truncation[-{hash}]/
#           ├── {input_dataset}.{input_group}.{orf_filter_preset}.{trunc_site_1}.w{trunc_width}.gtf   # trunc_site × trunc_width
#           └── {input_dataset}.{input_group}.{orf_filter_preset}.{trunc_site_2}.w{trunc_width}.gtf   # expand into files, not folders

############################
# 01. GENERAL RUN SETTINGS
############################

## Reference genome and annotation (GENCODE GRCh38 / v48)
ref_genome: "/home/MinaRyten/Guillermo/Resources/Genome/GRCh38.primary_assembly.genome.fa"
ref_annotation: "/home/MinaRyten/Guillermo/Resources/GENCODE/gencode.v48.annotation.gtf"

## 3'/5' truncation parameters
trunc_site:  ["3p", "5p"] # Truncation site: "3p" or "5p"
trunc_width: [500, 300] # Window size (bp) around truncation site
input_dataset: ["Wood"] # Dataset to employ to generate the ENDome
merge_preset: ["st_ref", "iso_ref"] # ["st_ref", "iso_ref", "iso_ref_lean"]
orf_filter_preset: ["ref_pc", "pc_novel"]
pseudobulk_preset: ["default", "dynamic"]
satuRn_preset: ["default", "raw"]


## Output directories
main_output_path: "debug_results"
log_path: ".logs"
benchmark_path: ".benchmarks"

## Output folder hashing
### If True, each step's output folder gets a 5-character hash suffix derived
### from the parameters used in that step and in every step before it, e.g.
### "01-Alignment-a3f9c" instead of "01-Alignment". The hash is cumulative:
### changing a parameter of one step also renames the folders of all later
### steps. Preset names are ignored, so renaming a preset keeps the hash.
###
### Set to True for safe iterative experimentation, as changing any tool
### parameter will produce a new folder, leaving prior results intact. Set to
### False for human readable folder names, but pipeline might NOT detect
### parameter changes within a step. Recommended for finalized and fixed
### configurations.
use_hash: True

## Parameter provenance dumps
### Every step writes a "parameters.yaml" file recording the resolved settings
### of that step and all previous ones. This flag controls how often it is
### (re)written:
###
### True: every snakemake invocation rewrites all "parameters.yaml" files, so
### they always carry the timestamp of the latest run. Note that they then show
### up as jobs in every `snakemake -n` dry-run.
### False: a "parameters.yaml" is only written when it is missing or when the
### recorded parameters have actually changed. Recommended.
always_save_params: False

