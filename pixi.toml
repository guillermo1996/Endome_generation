[workspace]
authors = ["guillermo171996 <guillermorocamora@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "40-ENDome_generation"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
snakemake = ">=9.23.0,<10"
conda = ">=26.5.3,<27"

# ── Sketch: R/Bioconductor env for all R scripts, managed by pixi instead of ──
# ── a conda yaml solved by `snakemake --use-conda` (see workflow/envs/r.yaml). ──
# Not yet wired into the Snakefile — see conversation notes for the cutover.
[feature.r.dependencies]
openssl = "==3.4.1"
libcurl = "==8.12.1"
r-base = "==4.3.3"
r-devtools = "==2.4.5"
r-tidyverse = "==2.0.0"
r-jsonlite = "==2.0.0"
r-matrix = "*"
bioconductor-biocgenerics = "==0.48.1"
bioconductor-s4vectors = "==0.40.2"
bioconductor-iranges = "==2.36.0"
bioconductor-genomicranges = "==1.54.1"
bioconductor-biocparallel = "==1.36.0"
bioconductor-rtracklayer = "==1.62.0"
bioconductor-plyranges = "==1.22.0"
bioconductor-annotationdbi = "==1.64.1"
bioconductor-genomicfeatures = "==1.54.1"
bioconductor-biostrings = "==2.70.1"
"bioconductor-bsgenome.mmusculus.ucsc.mm10" = "*"
"bioconductor-bsgenome.hsapiens.ucsc.hg38" = "*"
bioconductor-saturn = "==1.10.0"
bioconductor-summarizedexperiment = "==1.32.0"
bioconductor-singlecellexperiment = "==1.24.0"
bioconductor-edger = "==4.0.0"
bioconductor-limma = "==3.58.1"
bioconductor-stager = "==1.24.0"

[feature.r.tasks]
# gtxcutr needs a local package installed post-solve; pixi has no post-deploy
# hook like conda's *.post-deploy.sh, so it becomes an explicit task instead.
install-gtxcutr = "R CMD INSTALL /home/drihome/MRGuillermoPerez/tools/gtxcutr"

[environments]
r = { features = ["r"], no-default-feature = true }
